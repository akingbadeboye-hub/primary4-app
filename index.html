<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Primary 4 Adventure — First Term 2026/2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241B4B;--muted:#5D5786;--paper:#F5F2FF;--card:#FFFFFF;--line:#E2DBF6;
  --mango:#FFB627;--hib:#FF4F81;--teal:#0FA3A3;--ok:#178A4E;--okbg:#DFF5E7;--bad:#C72A63;--badbg:#FFE3EC;
  --sh:0 5px 0 rgba(36,27,75,.10);--f1:'Fredoka','Trebuchet MS',system-ui,sans-serif;--f2:'Nunito','Segoe UI',system-ui,sans-serif;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#F1EEFF;--muted:#B9B2E0;--paper:#151130;--card:#221B47;--line:#3A3168;--okbg:#14382A;--badbg:#45172E;--ok:#59D68F;--bad:#FF7DA6;--sh:0 5px 0 rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--ink:#F1EEFF;--muted:#B9B2E0;--paper:#151130;--card:#221B47;--line:#3A3168;--okbg:#14382A;--badbg:#45172E;--ok:#59D68F;--bad:#FF7DA6;--sh:0 5px 0 rgba(0,0,0,.35)}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f2);font-size:17px;line-height:1.5;min-height:100%;-webkit-tap-highlight-color:transparent}
h1,h2,h3,h4{font-family:var(--f1);font-weight:600;line-height:1.15;margin:0}
button{font:inherit;color:inherit}
.wrap{max-width:900px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0 14px}
.brand{font-family:var(--f1);font-weight:700;font-size:1.15rem;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;padding:0}
.brand i{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--mango);color:#241B4B;font-style:normal;font-size:1.1rem}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:2px solid var(--line);border-radius:999px;padding:5px 12px;font-family:var(--f1);font-weight:600;font-size:.95rem}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.btn{font-family:var(--f1);font-weight:600;font-size:1.05rem;border:0;border-radius:16px;padding:13px 22px;background:var(--sc,var(--hib));color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.22);cursor:pointer;transition:transform .08s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.22)}
.btn.ghost{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:0 4px 0 var(--line)}
.btn.sm{padding:8px 14px;font-size:.95rem;border-radius:12px}
.btn[disabled]{opacity:.45;pointer-events:none}
:focus-visible{outline:3px solid var(--mango);outline-offset:2px}
.card{background:var(--card);border:2px solid var(--line);border-radius:22px;padding:18px;box-shadow:var(--sh)}
.muted{color:var(--muted)}
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px;color:#fff;background:#3A2C8F;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;margin-bottom:18px}
.hero:before{content:"";position:absolute;inset:0;background:
  radial-gradient(circle at 12px 12px,rgba(255,182,39,.55) 0 4px,transparent 5px) 0 0/34px 34px,
  radial-gradient(circle at 29px 29px,rgba(255,79,129,.5) 0 4px,transparent 5px) 0 0/34px 34px;opacity:.45}
.hero>*{position:relative}
.hero h1{font-size:clamp(1.7rem,6vw,2.5rem)}
.hero p{margin:.4rem 0 0;opacity:.92}
.owl{width:96px;height:96px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.2))}
.xpbar{height:12px;border-radius:99px;background:rgba(255,255,255,.25);overflow:hidden;margin-top:12px;max-width:340px}
.xpbar b{display:block;height:100%;background:var(--mango);border-radius:99px}
.next{display:flex;align-items:center;gap:14px;justify-content:space-between;flex-wrap:wrap;margin-bottom:22px;border-color:var(--mango)}
.next h3{font-size:1.25rem}
.sec{font-size:1.35rem;margin:26px 0 12px}
.subs{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}
.sj{background:color-mix(in srgb,var(--sc) 14%,var(--card));border:2px solid color-mix(in srgb,var(--sc) 35%,var(--line));border-radius:18px;padding:12px}
.sj b{font-family:var(--f1);font-weight:600;font-size:.95rem;display:block;line-height:1.15}
.sj .ic{font-size:1.5rem}
.meter{height:8px;border-radius:99px;background:color-mix(in srgb,var(--sc) 22%,transparent);margin-top:8px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sc);border-radius:99px}
.trail{position:relative;display:flex;flex-direction:column;gap:16px;padding:6px 0}
.trail:before{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:5px dotted var(--line);transform:translateX(-50%)}
.node{background:none;padding:0;position:relative;width:min(88%,420px);display:flex;gap:12px;align-items:center;text-decoration:none;color:inherit;cursor:pointer;border:0;text-align:left;font:inherit}
.node:nth-child(odd){margin-right:auto}.node:nth-child(even){margin-left:auto}
.node .card{flex:1;padding:12px 14px;border-radius:20px}
.node .num{flex:none;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-family:var(--f1);font-weight:700;font-size:1.5rem;background:var(--mango);color:#241B4B;border:4px solid var(--card);box-shadow:0 5px 0 rgba(36,27,75,.18)}
.node.done .num{background:#3DBE7A;color:#fff}
.node.break .num{background:#7A4FD6;color:#fff}
.node.fin .num{background:var(--hib);color:#fff}
.node h3{font-size:1.1rem}
.dots{display:flex;gap:5px;margin-top:6px}
.dots i{width:13px;height:13px;border-radius:50%;background:color-mix(in srgb,var(--sc) 22%,var(--card));border:2px solid var(--sc)}
.dots i.on{background:var(--sc)}
.small{font-size:.86rem}
.badges{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.bd{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:12px;text-align:center;opacity:.5;filter:grayscale(1)}
.bd.on{opacity:1;filter:none;border-color:var(--mango)}
.bd .e{font-size:2rem}
.bd b{font-family:var(--f1);font-weight:600;display:block}
.crumb{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.band{border-radius:24px;padding:18px;color:#fff;background:var(--sc);margin-bottom:16px;display:flex;gap:14px;align-items:center}
.band .ic{font-size:2.6rem}
.band h1{font-size:clamp(1.4rem,5vw,2rem)}
.band p{margin:.2rem 0 0;opacity:.95}
.wk{margin-bottom:16px;border-radius:24px;overflow:hidden;border:2px solid color-mix(in srgb,var(--sc) 40%,var(--line));background:var(--card)}
.wk .hd{background:var(--sc);color:#fff;padding:12px 16px;display:flex;align-items:center;gap:10px}
.wk .hd h3{font-size:1.15rem}
.wk .hd small{opacity:.9;display:block;font-family:var(--f2);font-weight:600}
.lsn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 16px;border-top:2px solid var(--line);text-decoration:none;color:inherit;cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;font:inherit}
.lsn:hover{background:color-mix(in srgb,var(--sc) 8%,var(--card))}
.lsn b{font-family:var(--f1);font-weight:600}
.star{color:#FFB627;letter-spacing:2px;white-space:nowrap}
.star .off{color:var(--line)}
.testcard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:linear-gradient(135deg,#FF4F81,#FF8A3D);color:#fff;border:0;border-radius:24px;padding:18px}
.testcard h3{font-size:1.3rem}
.testcard .btn{background:#fff;color:#B21E55}
.learn h2{font-size:1.25rem;margin:22px 0 10px}
.say{font-size:1.2rem;font-weight:600}
.keys{list-style:none;padding:0;margin:0;display:grid;gap:10px}
.keys li{display:flex;gap:12px;background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px 14px}
.keys li:before{content:"💡";flex:none}
.exs{display:grid;gap:10px}
.ex{display:grid;grid-template-columns:1fr;gap:4px;border-radius:16px;padding:12px 14px;background:color-mix(in srgb,var(--sc) 12%,var(--card));border-left:8px solid var(--sc)}
.ex b{font-family:var(--f1);font-weight:600}
.ex span{color:var(--muted)}
.prog{height:14px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--sc);border-radius:99px;transition:width .3s}
.qcard{margin-top:14px}
.qtag{display:inline-flex;align-items:center;gap:6px;font-weight:800;font-size:.85rem;background:color-mix(in srgb,var(--sc) 16%,var(--card));color:var(--ink);border-radius:99px;padding:3px 12px}
.qtext{font-family:var(--f1);font-weight:500;font-size:clamp(1.25rem,4.6vw,1.65rem);line-height:1.3;margin:12px 0 16px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;min-height:58px;padding:10px 14px;border-radius:16px;border:3px solid var(--line);background:var(--card);cursor:pointer;font-weight:700;font-size:1.05rem;box-shadow:0 4px 0 var(--line)}
.opt .l{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--sc) 18%,var(--card));font-family:var(--f1);font-weight:700}
.opt:hover{border-color:var(--sc)}
.opt.sel{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,var(--card))}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.bad{border-color:var(--bad);background:var(--badbg)}
.opt.dim{opacity:.55}
.tf .opt{justify-content:center;font-family:var(--f1);font-size:1.3rem}
.fb{margin-top:14px;border-radius:18px;padding:14px 16px;border:2px solid}
.fb.ok{background:var(--okbg);border-color:var(--ok)}
.fb.bad{background:var(--badbg);border-color:var(--bad)}
.fb h4{font-size:1.15rem;margin-bottom:4px}
.fb .ans{font-weight:800;margin-top:8px}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
.timer{font-family:var(--f1);font-weight:700;font-size:1.2rem;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:4px 12px}
.timer.low{background:var(--badbg);border-color:var(--bad);color:var(--bad);animation:pulse 1s infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:6px;margin-top:14px}
.pal button{height:38px;border-radius:10px;border:2px solid var(--line);background:var(--card);font-family:var(--f1);font-weight:600;cursor:pointer}
.pal button.a{background:color-mix(in srgb,var(--sc,#3A2C8F) 25%,var(--card));border-color:var(--sc,#3A2C8F)}
.pal button.c{outline:3px solid var(--mango)}
.res{text-align:center}
.res .big{font-family:var(--f1);font-weight:700;font-size:clamp(2.6rem,12vw,4.2rem);line-height:1}
.res .st{font-size:2.6rem;letter-spacing:6px;color:#FFB627}
.bars{display:grid;gap:8px;text-align:left;margin-top:14px}
.bar{display:grid;grid-template-columns:120px 1fr 52px;gap:8px;align-items:center;font-size:.9rem;font-weight:700}
.rev{margin-top:10px;text-align:left}
.rev .card{margin-bottom:10px;padding:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:16px}
.widget{margin:18px 0;background:color-mix(in srgb,var(--sc) 9%,var(--card));border:3px dashed color-mix(in srgb,var(--sc) 55%,var(--line));border-radius:24px;padding:14px}
.widget h4{font-size:1.15rem;margin-bottom:8px}
.chip{display:inline-flex;align-items:center;justify-content:center;background:var(--card);border:3px solid var(--sc);border-radius:14px;padding:8px 12px;font-weight:800;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 0 color-mix(in srgb,var(--sc) 40%,transparent)}
.chip.sel{background:var(--sc);color:#fff}
.chip.dragging{opacity:.3}
.chip.ghost{opacity:.95;z-index:999}
.chip.locked{cursor:default;background:var(--okbg);border-color:var(--ok);box-shadow:none}
.chip.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px;padding:8px;border-radius:16px;background:color-mix(in srgb,var(--sc) 6%,var(--card))}
.bks{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:10px}
.bk{border:3px solid var(--line);background:var(--card);border-radius:18px;padding:8px;min-height:110px}
.bk.hot{border-color:var(--sc);background:color-mix(in srgb,var(--sc) 14%,var(--card))}
.bk h5{font-family:var(--f1);font-weight:600;font-size:1rem;margin:0 0 6px;text-align:center}
.bk .in{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.msg{margin-top:10px;font-weight:800;min-height:1.4em}
.msg.ok{color:var(--ok)}.msg.bad{color:var(--bad)}
.pvw{overflow-x:auto;padding-bottom:6px}
.pvr{display:flex;gap:6px;justify-content:center;min-width:max-content;margin:0 auto}
.pvg{display:flex;gap:4px;padding:6px;border-radius:16px;background:color-mix(in srgb,var(--sc) 10%,var(--card))}
.pvg small{display:block;text-align:center;font-weight:800;font-size:.68rem;color:var(--muted);margin-bottom:2px}
.pvc{width:52px;text-align:center}
.pvc .h{font-family:var(--f1);font-weight:700;font-size:.9rem;color:var(--sc)}
.pvc .slot{height:62px;border:3px dashed var(--sc);border-radius:12px;display:grid;place-items:center;font-family:var(--f1);font-weight:700;font-size:1.8rem;background:var(--card);cursor:pointer}
.pvc .slot.hot{background:color-mix(in srgb,var(--sc) 20%,var(--card))}
.pvc .slot.f{border-style:solid;background:var(--sc);color:#fff}
.pvc .slot.good{background:var(--ok);border-color:var(--ok)}
.pvc .slot.wrong{background:var(--bad);border-color:var(--bad)}
.pvc .v{font-size:.68rem;font-weight:800;color:var(--muted);margin-top:2px;min-height:1.6em;line-height:1.1;word-break:break-all}
.tray{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.tile{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-family:var(--f1);font-weight:700;font-size:1.5rem;background:var(--mango);color:#241B4B;cursor:grab;user-select:none;touch-action:none;box-shadow:0 4px 0 rgba(0,0,0,.2);border:0}
.tile.sel{outline:4px solid var(--sc)}
.tile.ghost{position:fixed}
.target{font-family:var(--f1);font-weight:700;font-size:clamp(1.6rem,7vw,2.4rem);text-align:center}
.legend{font-size:.8rem;color:var(--muted);text-align:center}
.rbtn{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:10px 0}
.rbtn button{min-width:52px;height:52px;border-radius:14px;border:0;background:var(--sc);color:#fff;font-family:var(--f1);font-weight:700;font-size:1.4rem;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.disp{font-family:var(--f1);font-weight:700;font-size:2rem;text-align:center;min-height:2.4rem;letter-spacing:3px}
.digs{display:flex;justify-content:center;gap:2px;font-family:var(--f1);font-weight:700;font-size:2rem;margin:8px 0}
.digs span{padding:2px 6px;border-radius:8px}
.digs .a{background:var(--mango);color:#241B4B}
.digs .b{background:var(--hib);color:#fff}
input[type=range]{width:100%;accent-color:var(--sc)}
input[type=text]{width:100%;font:inherit;font-weight:700;font-size:1.3rem;padding:12px 14px;border-radius:14px;border:3px solid var(--line);background:var(--card);color:var(--ink)}
.avs{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0}
.avs button{font-size:2rem;width:60px;height:60px;border-radius:18px;border:3px solid var(--line);background:var(--card);cursor:pointer}
.avs button.on{border-color:var(--hib);background:color-mix(in srgb,var(--hib) 15%,var(--card))}
.welcome{max-width:520px;margin:30px auto;text-align:center}
.welcome .owl{width:130px;height:130px}
.pop{animation:pop .5s}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
.warn{background:var(--badbg);border:2px solid var(--bad);border-radius:16px;padding:12px;margin-top:12px}
@media (max-width:520px){
  body{font-size:16px}
  .hero{grid-template-columns:1fr}.hero .owl{width:70px;height:70px;position:absolute;right:14px;top:14px}
  .bar{grid-template-columns:96px 1fr 44px;font-size:.8rem}
  .node{width:94%}
  .pvc{width:40px}.pvc .slot{height:54px;font-size:1.5rem}.tile{width:40px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- accounts / landing / staff ---- */
.landing{max-width:640px;margin:8vh auto 40px;text-align:center;padding:0 16px}
.landing h1{font-size:clamp(1.8rem,6vw,2.6rem);margin:14px 0 6px}
.rolebtns{display:grid;gap:14px;margin-top:26px;text-align:left}
.rolebtn{display:flex;align-items:center;gap:14px;padding:18px 20px;border-radius:20px;border:3px solid var(--line);background:var(--card);cursor:pointer;font:inherit;color:inherit;width:100%}
.rolebtn .e{font-size:2.2rem;flex:none}
.rolebtn b{font-family:var(--f1);font-size:1.15rem;display:block}
.rolebtn:hover{border-color:var(--hib)}
.authwrap{max-width:440px;margin:6vh auto 40px;padding:0 16px}
.authwrap .back{margin-bottom:14px}
.tabs{display:flex;gap:8px;margin-bottom:16px}
.tabs button{flex:1;padding:10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-family:var(--f1);font-weight:600;cursor:pointer}
.tabs button.on{background:var(--hib);color:#fff;border-color:var(--hib)}
.field{margin-bottom:12px;text-align:left}
.field label{display:block;font-weight:700;font-size:.9rem;margin-bottom:4px}
.roletog{display:flex;gap:8px;margin-bottom:12px}
.roletog button{flex:1;padding:12px;border-radius:14px;border:2px solid var(--line);background:var(--card);font:inherit;font-weight:700;cursor:pointer}
.roletog button.on{border-color:var(--teal);background:color-mix(in srgb,var(--teal) 16%,var(--card))}
.err{background:var(--badbg);color:var(--bad);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-weight:700;text-align:left}
.staffcard{display:flex;align-items:center;gap:14px;padding:14px;border-radius:18px;border:2px solid var(--line);background:var(--card);margin-bottom:10px}
.staffcard .av{font-size:2rem;flex:none}
.staffcard .meta{flex:1;min-width:0}
.skeleton{height:64px;border-radius:18px;background:linear-gradient(90deg,var(--line),var(--paper),var(--line));background-size:200% 100%;animation:shimmer 1.4s infinite;margin-bottom:10px}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
.idpill{display:inline-flex;gap:6px;align-items:center;background:rgba(255,255,255,.2);border-radius:999px;padding:6px 14px;font-family:var(--f1);font-weight:700}
.addrow{display:flex;gap:8px;margin-bottom:6px}
.addrow input{flex:1}
.loadwrap{max-width:400px;margin:20vh auto;text-align:center}
</style>
</head>

/* ---------- 0. Comparing numbers: >, <, = ---------- */
function cmpWhy(a, b, rel) {
  const symOf = { gt: '>', lt: '<', eq: '=' };
  if (a === b) return 'Both numbers have exactly the same value: ' + fm(a) + ' = ' + fm(b) + '.';
  const sa = String(a), sb = String(b);
  if (sa.length !== sb.length) return 'Count the digits first: ' + fm(a) + ' has ' + sa.length + ' digit' + (sa.length > 1 ? 's' : '') + ' and ' + fm(b) + ' has ' + sb.length + ' digit' + (sb.length > 1 ? 's' : '') + '. The number with more digits is bigger, so ' + fm(a) + ' ' + symOf[rel] + ' ' + fm(b) + '.';
  let i = 0; while (i < sa.length && sa[i] === sb[i]) i++;
  const place = PLN[sa.length - 1 - i] || 'first';
  return 'Both numbers have the same number of digits, so compare from the left. They match until the ' + place + ' place: ' + sa[i] + ' ' + symOf[rel] + ' ' + sb[i] + ', so ' + fm(a) + ' ' + symOf[rel] + ' ' + fm(b) + '.';
}
function cmpPair(sameLen) {
  const len = R(2, 6); let a = randNum(len), b;
  if (sameLen) { b = R(0, 3) === 0 ? a : mutate(a); }
  else { b = R(0, 1) ? randNum(len) : randNum(Math.max(2, len + pick([-1, 1]))); }
  return [a, b];
}
function genCompare() {
  const symOf = { gt: '>', lt: '<', eq: '=' };
  const t = R(1, 8);
  if (t === 1 || t === 2) {
    const [a, b] = cmpPair(t === 1); const rel = a > b ? 'gt' : a < b ? 'lt' : 'eq';
    const opts = ['gt', 'lt', 'eq'].filter(x => x !== rel).map(x => symOf[x]);
    return { q: fm(a) + ' ___ ' + fm(b) + '. Which symbol goes in the blank?', c: symOf[rel], w: opts, why: cmpWhy(a, b, rel) };
  }
  if (t === 3 || t === 4) {
    let a = randNum(R(3, 6)), b; do { b = randNum(R(3, 6)); } while (b === a);
    const bigger = Math.max(a, b), smaller = Math.min(a, b); const askBig = t === 3;
    return { q: 'Which number is ' + (askBig ? 'greater' : 'smaller') + ' — ' + fm(a) + ' or ' + fm(b) + '?', c: fm(askBig ? bigger : smaller), w: [fm(askBig ? smaller : bigger)], why: cmpWhy(bigger, smaller, 'gt') };
  }
  if (t === 5 || t === 6) {
    const askBig = t === 5; const base = randNum(R(3, 5));
    const far = base + (askBig ? R(1, 999) : -R(1, Math.max(1, Math.min(998, base - 1 || 1))));
    let s1 = askBig ? base - R(1, Math.max(1, Math.min(998, base - 1 || 1))) : base + R(1, 999);
    let s2 = askBig ? s1 - R(5, 200) : s1 + R(5, 200); if (s2 < 0) s2 = base + (askBig ? 1000 : -1);
    const others = [base, s1, s2];
    return { q: 'Which number is ' + (askBig ? 'greater' : 'less') + ' than ' + fm(base) + '?', c: fm(far), w: others.map(fm), why: 'Only ' + fm(far) + ' is ' + (askBig ? 'bigger' : 'smaller') + ' than ' + fm(base) + '. The others are ' + (askBig ? 'equal to or smaller' : 'equal to or bigger') + '.' };
  }
  if (t === 7) {
    const [a, b] = cmpPair(R(0, 1)); const rel = a > b ? 'gt' : a < b ? 'lt' : 'eq'; const truth = R(0, 1);
    const claim = truth ? rel : pick(['gt', 'lt', 'eq'].filter(x => x !== rel));
    return T(fm(a) + ' ' + symOf[claim] + ' ' + fm(b), !!truth, cmpWhy(a, b, rel));
  }
  const a = randNum(R(3, 6));
  return { q: fm(a) + ' ___ ' + fm(a) + '. Which symbol goes in the blank?', c: '=', w: ['>', '<'], why: 'Both numbers are exactly the same: ' + fm(a) + ' = ' + fm(a) + '.' };
}

  Q('They ___ lived in Lagos for five years.', 'have', 'has', 'are', 'was', 'They needs have.'),
  Q('The past participle of "write" is:', 'written', 'wrote', 'writed', 'writing', 'write → wrote → written.'),
  Q('We ___ never seen a lion.', 'have', 'has', 'is', 'am', 'We needs have.'),
  Q('Ngozi ___ just arrived.', 'has', 'have', 'is', 'do', 'Ngozi is one person: has just arrived.'),
  Q('I ___ that film. (see)', 'have seen', 'have saw', 'has seen', 'seen', 'Have + the past participle seen.'),

  Q('Tolu ___ his bag. (lose)', 'has lost', 'has lose', 'have lost', 'losed', 'He needs has + the past participle lost.'),
  Q('Choose the correct sentence.', 'She has gone to school.', 'She have gone to school.', 'She has went to school.', 'She having gone to school.', 'Has + gone is correct. Went is not a past participle.'),
  Q('"He has broken the cup." This shows:', 'an action done that matters now', 'an action that will happen tomorrow', 'an action happening right now', 'a habit', 'The cup is broken now.'),
  T('The present perfect uses has or have + past participle.', true, 'That is the form.'),

  T("'Has' goes with 'she', 'he' and 'it'.", true, 'Yes.'),

/* ---------- question building ---------- */
function rawFor(id, n) {
  const s = SUBS[id];
  if (s.gen) { const out = [], seen = new Set(); let g = 0; while (out.length < n && g++ < n * 25) { const q = s.gen(); if (!seen.has(q.q)) { seen.add(q.q); out.push(q); } } return out; }
  return shuffle(s.qs).slice(0, n);
}
function prep(q, id) { const opts = q.tf ? ['True', 'False'] : shuffle([q.c].concat(q.w)); return { q: q.q, opts: opts, ci: opts.indexOf(q.c), why: q.why, tf: !!q.tf, sub: id, subject: SUBS[id].subject }; }
function whyText(q) { return (q.tf ? 'The statement is ' + q.opts[q.ci].toLowerCase() + '. ' : '') + q.why; }
function distribute(total, ids) { const c = {}; const base = Math.floor(total / ids.length); ids.forEach(i => c[i] = base); let rem = total - base * ids.length; shuffle(ids).forEach(i => { if (rem > 0) { c[i]++; rem--; } }); return c; }
function buildTest(mix, pools) {
  const out = [];
  SUBJECT_ORDER.forEach(sj => {
    const ids = pools[sj]; if (!ids || !ids.length || !mix[sj]) return; const cnt = distribute(mix[sj], ids); let grp = [];
    ids.forEach(id => { const n = cnt[id]; if (!n) return; const cap = SUBS[id].gen ? n : Math.min(n, SUBS[id].qs.length); rawFor(id, cap).forEach(q => grp.push(prep(q, id))); });
    shuffle(grp).forEach(q => out.push(q));
  });
  return out;
}
function poolsFor(ids) { const p = {}; ids.forEach(id => { const s = SUBS[id].subject; (p[s] = p[s] || []).push(id); }); return p; }
function testSpec(key) {
  if (key === 'final') return { title: 'Final Practice Exam', cfg: CFG.finalTest, pools: poolsFor(ORDER) };
  if (key === 'mid') return { title: 'Mid-term Revision Test (Weeks 1–5)', cfg: CFG.midTest, pools: poolsFor(ORDER.filter(id => SUB_WEEK[id] <= 5)) };
  const m = /^w(\d+)$/.exec(key); const w = m && WEEKS.find(x => x.n == m[1]); if (!w) return null;
  const pools = {}; w.items.forEach(it => { pools[it.s] = (it.subs.length ? it.subs : it.revise).slice(); });
  return { title: 'Week ' + w.n + ' Test', cfg: CFG.weekTest, pools: pools };
}

function makeDrag(el, dropSel, onDrop, onTap) {

    const under = ev => { const n = document.elementFromPoint(ev.clientX, ev.clientY); return n && n.closest(dropSel); };
    const clear = () => document.querySelectorAll('.hot').forEach(n => n.classList.remove('hot'));

    const up = ev => { document.removeEventListener('pointermove', mv); document.removeEventListener('pointerup', up); document.removeEventListener('pointercancel', up); g.remove(); el.classList.remove('dragging'); clear(); if (!moved) { onTap && onTap(el); return; } const t = under(ev); if (t) onDrop(t, el); };
    document.addEventListener('pointermove', mv); document.addEventListener('pointerup', up); document.addEventListener('pointercancel', up);
  });
}

function mountRound(el) {

/* ---------- learner practice/test sessions ---------- */
function startPractice(id) {
  if (!SUBS[id]) { go('#/home'); return; }
  const qs = rawFor(id, 15).map(q => prep(q, id));
  S.sess = { kind: 'practice', id: id, qs: qs, i: 0, picked: null, score: 0, miss: [], picks: {}, done: false, praise: '' };
}
function finishPractice() {
  const p = S.sess, pct = Math.round(p.score / p.qs.length * 100), stz = stars(pct), prev = D.sub[p.id] || { best: 0, att: 0 };
  const xp = p.score * 10 + (stz === 3 ? 20 : 0);
  D.sub[p.id] = { best: Math.max(prev.best, pct), att: prev.att + 1 }; D.xp += xp; save();
  p.done = true; p.result = { score: p.score, pct: pct, stars: stz, xp: xp };
}
function startTest(key) {
  const sp = testSpec(key); if (!sp) { go('#/home'); return; }
  const qs = buildTest(sp.cfg.mix, sp.pools);
  S.sess = { kind: 'test', key: key, title: sp.title, qs: qs, i: 0, ans: qs.map(() => null), start: Date.now(), end: Date.now() + sp.cfg.mins * 60000, done: false, confirm: null };
  stopTimer(); S.tick = setInterval(tick, 500);
}
function stopTimer() { if (S.tick) { clearInterval(S.tick); S.tick = null; } }
function tick() {
  const t = S.sess; if (!t || t.kind !== 'test' || t.done) { stopTimer(); return; }
  const left = Math.max(0, Math.round((t.end - Date.now()) / 1000)), el = $('#tm');
  if (el) { el.textContent = fmtT(left); el.parentElement.classList.toggle('low', left < 300); }
  if (left <= 0) finishTest(true);
}
function finishTest(auto) {
  const t = S.sess; if (!t || t.done) return; stopTimer();
  let correct = 0; const by = {}, wrong = [], weak = {};
  t.qs.forEach((q, i) => { const b = by[q.subject] = by[q.subject] || { c: 0, t: 0 }; b.t++; if (t.ans[i] === q.ci) { correct++; b.c++; } else { wrong.push({ q: q, picked: t.ans[i] }); weak[q.sub] = (weak[q.sub] || 0) + 1; } });
  const pct = Math.round(correct / t.qs.length * 100), xp = correct * 2, prev = D.tests[t.key] || { best: 0, att: 0 };
  D.tests[t.key] = { best: Math.max(prev.best, pct), att: prev.att + 1, last: pct }; D.xp += xp; save();
  t.done = true; t.result = { correct: correct, pct: pct, by: by, wrong: wrong, weak: weak, xp: xp, auto: !!auto, used: Math.min(Math.round((Date.now() - t.start) / 1000), Math.round((t.end - t.start) / 1000)) };
  render(); window.scrollTo(0, 0);
}

function ensureLearnerData(u) {
  if (LCACHE[u] !== undefined) return;
  LCACHE[u] = null;
  fsGet('learners/' + u).then(prog => { LCACHE[u] = prog || false; render(true); }).catch(() => { LCACHE[u] = false; render(true); });
}
function miniStats(prog) {
  const doneN = ORDER.filter(id => prog.sub && prog.sub[id] && prog.sub[id].att).length;
  const st = ORDER.reduce((a, id) => a + (prog.sub && prog.sub[id] ? stars(prog.sub[id].best) : 0), 0);
  return { doneN: doneN, stars: st, lvl: 1 + Math.floor((prog.xp || 0) / 150), xp: prog.xp || 0 };
}

/* ---------- auth actions ---------- */
function newAuthState(role) { return { role: role, tab: 'signup', err: '', info: '', busy: false, f: { avatar: AVATARS[0], staffRole: 'parent' } }; }
document.addEventListener('input', e => { const el = e.target.closest('[data-bind]'); if (el && S.auth) S.auth.f[el.dataset.bind] = el.value; });

async function doLearnerSignup(a) {
  const f = a.f, name = (f.name || '').trim(), uname = norm(f.username), pin = (f.pin || '').trim(), pin2 = (f.pin2 || '').trim();
  if (!name) { a.err = 'Please enter a name.'; render(); return; }
  if (!validUser(uname)) { a.err = 'Choose a Learner ID: 3–20 letters, numbers or _.'; render(); return; }
  if (!validPin(pin)) { a.err = 'PIN must be 4–6 digits.'; render(); return; }
  if (pin !== pin2) { a.err = 'PINs do not match.'; render(); return; }
  a.busy = true; a.err = ''; render();
  try {
    const exists = await fsGet('learners/' + uname);
    if (exists) { a.busy = false; a.err = 'That Learner ID is taken. Try another.'; render(); return; }
    const prog = { name: name, avatar: f.avatar || AVATARS[0], pin: pin, xp: 0, sub: {}, tests: {}, seen: {}, createdAt: Date.now() };
    await fsSet('learners/' + uname, prog);
    D = prog; D.username = uname; localSaveLearner(); setLocalSession({ kind: 'learner', username: uname }); STAFF = null;
    a.busy = false; go('#/home');
  } catch (e) { a.busy = false; a.err = fbErr(e); render(); }
}

}

    const cred = await signInWithEmailAndPassword(auth, email, pass);
    let profile = await fsGet('staff/' + cred.user.uid);
    if (!profile) { profile = { name: (email.split('@')[0] || 'Account'), role: 'parent', linked: [], createdAt: Date.now() }; await fsSet('staff/' + cred.user.uid, profile); }
    clearLocalSession(); STAFF = Object.assign({ uid: cred.user.uid }, profile); D = null;
    a.busy = false; go('#/staff');
  } catch (e) { a.busy = false; a.err = fbErr(e); render(); }
}
async function doStaffForgot(a) {
  const email = (a.f.email || '').trim();
  if (!email) { a.err = 'Enter your email above first, then tap this again.'; render(); return; }
  try { await sendPasswordResetEmail(auth, email); a.err = ''; a.info = 'Password reset email sent — check your inbox.'; render(); }
  catch (e) { a.info = ''; a.err = fbErr(e); render(); }
}

/* ---------- actions ---------- */
const ACT = {
  go(d) { go(d.to); },
  authrole(d) { S.auth = newAuthState(d.role); go('#/auth/' + d.role); },
  authtab(d) { S.auth.tab = d.tab; S.auth.err = ''; S.auth.info = ''; render(); },
  authavatar(d) { S.auth.f.avatar = d.a; render(true); },
  authstaffrole(d) { S.auth.f.staffRole = d.r; render(true); },
  authforgot(d, el, e) { e.preventDefault(); doStaffForgot(S.auth); },
  authsubmit() { const a = S.auth; if (a.busy) return; if (a.role === 'learner') { if (a.tab === 'signup') doLearnerSignup(a); else doLearnerLogin(a); } else { if (a.tab === 'signup') doStaffSignup(a); else doStaffLogin(a); } },
  logout() {
    const sess = getLocalSession();
    clearLocalSession(); D = null;
    if (sess && sess.kind === 'learner') { go('#/landing'); }
    else { signOut(auth).catch(() => { }); STAFF = null; go('#/landing'); }
  },
  reset1() { S.confirm = 'reset'; render(); }, reset0() { S.confirm = null; render(); },
  reset2() { D.sub = {}; D.tests = {}; D.xp = 0; D.seen = {}; save(); S.confirm = null; render(); },
  addlearner() {
    const el = $('#addl'); const uname = norm(el ? el.value : ''); S.staffErr = ''; if (!uname) return;
    if ((STAFF.linked || []).includes(uname)) { S.staffErr = 'Already added.'; render(); return; }
    fsGet('learners/' + uname).then(acc => {
      if (!acc) { S.staffErr = 'No learner found with that ID.'; render(); return; }
      STAFF.linked = (STAFF.linked || []).concat([uname]);
      fsUpdate('staff/' + STAFF.uid, { linked: arrayUnion(uname) }).catch(() => { });
      LCACHE[uname] = undefined; render();
    }).catch(() => { S.staffErr = 'Something went wrong. Please try again.'; render(); });
  },
  rmlearner(d) {
    STAFF.linked = (STAFF.linked || []).filter(u => u !== d.u); delete LCACHE[d.u];
    fsUpdate('staff/' + STAFF.uid, { linked: arrayRemove(d.u) }).catch(() => { });
    render();
  },
  startp(d) { S.sess = null; go('#/practice/' + d.id); },
  pick(d) { const p = S.sess; if (!p || p.picked !== null) return; const i = Number(d.i); p.picked = i; p.picks[p.i] = i; if (i === p.qs[p.i].ci) { p.score++; p.praise = pick(PRAISE); } else p.miss.push(p.i); render(true); setTimeout(() => { const f = $('.fb'); if (f && f.scrollIntoView) f.scrollIntoView({ block: 'center', behavior: 'smooth' }); }, 60); },
  pnext() { const p = S.sess; if (!p) return; if (p.i < p.qs.length - 1) { p.i++; p.picked = null; render(); window.scrollTo(0, 0); } else { finishPractice(); render(); window.scrollTo(0, 0); } },
  tpick(d) { const t = S.sess; if (!t || t.done) return; t.ans[t.i] = Number(d.i); t.confirm = null; render(true); },
  tgo(d) { const t = S.sess; t.i = Number(d.i); render(); window.scrollTo(0, 0); },
  tnext() { const t = S.sess; if (t.i < t.qs.length - 1) t.i++; render(); window.scrollTo(0, 0); },
  tprev() { const t = S.sess; if (t.i > 0) t.i--; render(); window.scrollTo(0, 0); },
  tsubmit() { S.sess.confirm = 'submit'; render(true); }, tcancel() { S.sess.confirm = null; render(true); },
  tfinish() { finishTest(false); },
  texit() { S.sess.confirm = 'exit'; render(true); }, tquit() { const k = S.sess.key; stopTimer(); S.sess = null; go(k === 'final' ? '#/home' : k === 'mid' ? '#/week/6' : '#/week/' + k.slice(1)); },
  retest() { const k = S.sess.key; S.sess = null; go('#/test/' + k); }
};
document.addEventListener('click', e => { const b = e.target.closest('[data-act]'); if (!b) return; const f = ACT[b.dataset.act]; if (f) f(b.dataset, b, e); });

/* ---------- render + route + boot ---------- */
function render(keep) {
  const y = window.scrollY; WCFG.length = 0; const r = S.r; let html;
  try {
    if (r.n === 'landing') html = viewLanding();
    else if (r.n === 'auth') html = viewAuth(r.a);
    else if (r.n === 'staff') html = viewStaffHome();
    else if (r.n === 'staffview') html = viewStaffLearner(r.a);
    else if (r.n === 'week') html = r.a == 6 ? viewMid() : viewWeek(r.a);
    else if (r.n === 'learn') html = viewLearn(r.a);
    else if (r.n === 'practice') html = viewPractice();
    else if (r.n === 'test') html = viewTest();
    else html = viewHome();
  } catch (e) { html = '<div class="wrap"><div class="card"><h2>Oops!</h2><p>Something went wrong. <button class="btn sm" data-act="go" data-to="' + (D ? '#/home' : STAFF ? '#/staff' : '#/landing') + '">Go back</button></p></div></div>'; console.error(e); }
  $('#app').innerHTML = html; mountWidgets(); if (keep) window.scrollTo(0, y);
}
const PUBLIC_ROUTES = ['landing', 'auth'];
const STAFF_ROUTES = ['staff', 'staffview'];
const LEARNER_ROUTES = ['home', 'week', 'learn', 'practice', 'test'];
function route() {
  if (!routeReady) return;
  const raw = (location.hash || '#/landing').replace(/^#\/?/, ''); const h = raw.split('/'); let n = h[0] || 'landing';
  const learnerIn = !!(D && D.username), staffIn = !!(STAFF && STAFF.uid);
  if (!learnerIn && !staffIn && !PUBLIC_ROUTES.includes(n)) { location.hash = '#/landing'; return; }
  if (learnerIn && PUBLIC_ROUTES.includes(n)) { location.hash = '#/home'; return; }
  if (staffIn && PUBLIC_ROUTES.includes(n)) { location.hash = '#/staff'; return; }
  if (learnerIn && STAFF_ROUTES.includes(n)) { location.hash = '#/home'; return; }
  if (staffIn && LEARNER_ROUTES.includes(n)) { location.hash = '#/staff'; return; }
  S.r = { n: n, a: h[1] };
  if (n === 'auth') { if (!S.auth || S.auth.role !== h[1]) S.auth = newAuthState(h[1] === 'staff' ? 'staff' : 'learner'); }
  if (learnerIn) {
    if (n !== 'test') { stopTimer(); if (S.sess && S.sess.kind === 'test') S.sess = null; }
    if (n !== 'practice' && S.sess && S.sess.kind === 'practice') S.sess = null;
    if (n === 'practice' && (!S.sess || S.sess.id !== h[1])) startPractice(h[1]);
    if (n === 'test' && (!S.sess || S.sess.key !== h[1])) startTest(h[1]);
    if (n === 'learn' && SUBS[h[1]] && !D.seen[h[1]]) { D.seen[h[1]] = 1; D.xp += 5; save(); }
  }
  S.confirm = null; render(); window.scrollTo(0, 0);
}
window.addEventListener('hashchange', route);

async function boot() {
  if (typeof FB_ERR !== 'undefined' && FB_ERR) { routeReady = true; S.r = { n: 'landing' }; render(); return; }
  const sess = getLocalSession();
  if (sess && sess.kind === 'learner') {
    $('#app').innerHTML = loadingScreen();
    const cached = localLoadLearner(sess.username);
    if (cached) { D = cached; D.username = sess.username; }
    try {
      const prog = await fsGet('learners/' + sess.username);
      if (prog) { D = prog; D.username = sess.username; localSaveLearner(); }
      else if (!cached) { clearLocalSession(); routeReady = true; S.r = { n: 'landing' }; render(); return; }
    } catch (e) { if (!cached) { routeReady = true; S.r = { n: 'landing' }; render(); return; } }
    routeReady = true;
    if (!location.hash || location.hash === '#/' || location.hash === '#/landing') location.hash = '#/home'; else route();
    return;
  }
  onAuthStateChanged(auth, async (user) => {
    if (routeReady) { if (!user && STAFF_ROUTES.includes(S.r.n)) { STAFF = null; go('#/landing'); } return; }
    if (user) {
      $('#app').innerHTML = loadingScreen();
      try {
        let profile = await fsGet('staff/' + user.uid);
        if (!profile) { profile = { name: (user.email || 'Account').split('@')[0], role: 'parent', linked: [], createdAt: Date.now() }; await fsSet('staff/' + user.uid, profile); }
        STAFF = Object.assign({ uid: user.uid }, profile);
        routeReady = true;
        if (!location.hash || location.hash === '#/' || location.hash === '#/landing') location.hash = '#/staff'; else route();
      } catch (e) { routeReady = true; S.r = { n: 'landing' }; render(); }
    } else {
      routeReady = true;
      if (!location.hash) location.hash = '#/landing'; else route();
    }
  }, () => { routeReady = true; S.r = { n: 'landing' }; render(); });
}
boot();
</script></body></html>
